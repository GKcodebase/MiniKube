# Spring Boot Service Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=Spring Boot Service

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.springboot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true

# Info endpoint configuration
info.app.name=Spring Boot Service
info.app.version=1.0.0
info.app.description=A simple Spring Boot REST API service
info.company.name=Example Company
